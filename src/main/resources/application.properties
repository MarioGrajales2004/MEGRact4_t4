spring.application.name=demo

# Puerto exclusivo de la Actividad 4 (8081, 8083 y 8085 son de las actividades anteriores)
server.port=8087

# MySQL. Valores por defecto = base local de pruebas.
# En el VPS se reemplazan con variables de entorno: DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/megr_act4?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:megr_act4}
spring.datasource.password=${DB_PASSWORD:megr_local_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT. La clave por defecto es solo para pruebas locales;
# en el VPS se usa otra, pasada con la variable de entorno JWT_SECRET (minimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:clave-local-de-pruebas-megr-act4-no-usar-en-produccion}
app.jwt.expiration-ms=3600000
